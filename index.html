<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드라마 레이더 · 자동 업데이트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EDF1F8; --line:rgba(15,23,42,0.08);
    --text:#1B2540; --text-dim:#5B6B85; --text-faint:#8D98AC;
    --broadcast:#2C5FAD; --broadcast-dim:rgba(44,95,173,0.10);
    --ott:#0E8FA8; --ott-dim:rgba(14,143,168,0.10); --gold:#B8860B; --gold-dim:rgba(184,134,11,0.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable',-apple-system,sans-serif;line-height:1.5;}
  .mono{font-family:monospace;}
  .ticker-wrap{background:#1B2540;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:10px 0;}
  .ticker-track{display:inline-flex;align-items:center;animation:scroll 38s linear infinite;}
  @keyframes scroll{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
  .ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 28px;font-size:13px;color:#C7D2E8;border-right:1px solid rgba(255,255,255,0.12);}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--broadcast);flex-shrink:0;}
  .ticker-tag{font-size:10px;padding:2px 6px;border-radius:3px;background:var(--broadcast-dim);color:var(--broadcast);}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px;}
  h1{font-size:32px;font-weight:800;margin-bottom:8px;}
  .meta{font-size:13px;color:var(--text-faint);margin-bottom:28px;}

  .trend-section{margin-bottom:32px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;}
  .trend-title{font-size:16px;font-weight:700;margin-bottom:16px;}
  .trend-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
  @media(max-width:900px){.trend-grid{grid-template-columns:1fr;}}
  .trend-card-title{font-size:12.5px;color:var(--text-faint);margin-bottom:10px;}
  .ratio-bar{display:flex;width:100%;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2);margin-bottom:10px;}
  .ratio-fill.b{background:var(--broadcast);}
  .ratio-fill.o{background:var(--ott);}
  .ratio-legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-dim);flex-wrap:wrap;}
  .ratio-legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .ratio-legend .dot.b{background:var(--broadcast);}
  .ratio-legend .dot.o{background:var(--ott);}
  .stat-list{display:flex;flex-direction:column;gap:8px;}
  .stat-row{display:flex;align-items:center;gap:8px;}
  .stat-label{font-size:12px;color:var(--text-dim);min-width:56px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat-bar-track{flex:1;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;}
  .stat-bar-fill{height:100%;background:var(--gold);border-radius:5px;}
  .stat-bar-fill.genre{background:var(--ott);}
  .stat-count{font-size:11px;color:var(--text-faint);min-width:18px;text-align:right;}
  .rank-row{display:flex;align-items:center;gap:8px;}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:var(--gold-dim);color:var(--gold);font-size:11px;font-weight:700;flex-shrink:0;}
  .rank-title{font-size:12.5px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-score{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;}
  .rank-votes{font-size:10.5px;color:var(--text-faint);font-weight:400;}

  .filters{display:flex;gap:8px;margin-bottom:20px;}
  .pill{font-size:12px;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--text-dim);cursor:pointer;}
  .pill.active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(max-width:720px){.grid{grid-template-columns:1fr;}}
  .card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .card-title-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .card-title{font-size:18px;font-weight:700;}
  .card-link{font-size:12px;color:var(--gold);text-decoration:none;border-bottom:1px dashed var(--gold);white-space:nowrap;}
  .badge{font-size:10.5px;padding:4px 8px;border-radius:4px;white-space:nowrap;margin-left:10px;}
  .badge.b{background:var(--broadcast-dim);color:var(--broadcast);}
  .badge.o{background:var(--ott-dim);color:var(--ott);}
  .card-row{display:flex;gap:8px;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .card-row .k{color:var(--text-faint);min-width:52px;}
  .rating{font-weight:600;color:var(--text);}
  .vote-count{font-size:11px;color:var(--text-faint);font-weight:400;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
  .tag{font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--surface-2);color:var(--text-dim);border:1px solid var(--line);}
  .ep-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);background:none;border-left:none;border-right:none;border-bottom:none;color:var(--text-dim);font-size:13px;font-family:inherit;cursor:pointer;}
  .ep-toggle .chev{transition:transform .2s ease;font-size:11px;color:var(--text-faint);}
  .ep-toggle.open .chev{transform:rotate(180deg);}
  .ep-panel{max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .ep-panel.open{max-height:900px;overflow-y:auto;}
  .ep-list{padding-top:12px;display:flex;flex-direction:column;gap:12px;}
  .ep-item{display:flex;gap:12px;}
  .ep-num{font-size:11px;color:var(--gold);background:var(--gold-dim);border-radius:5px;padding:3px 6px;height:fit-content;flex-shrink:0;white-space:nowrap;}
  .ep-body .ep-sub{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
  .ep-body .ep-date{font-size:11px;color:var(--text-faint);margin-bottom:4px;}
  .ep-body .ep-summary{font-size:12.5px;color:var(--text-dim);line-height:1.55;}
  .ep-empty{font-size:12.5px;color:var(--text-faint);padding:12px 0;}
  .overview-box{padding-top:4px;}
  .overview-label{font-size:11px;color:var(--text-faint);margin-bottom:6px;}
  .overview-text{font-size:12.5px;color:var(--text-dim);line-height:1.6;}
  .spoiler-note{font-size:11px;color:var(--text-faint);margin-top:10px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="ticker-wrap"><div class="ticker-track"></div></div>
<div class="wrap">
  <h1>드라마 레이더</h1>
  <div class="meta">자동 업데이트 · 마지막 갱신 2026-08-14 02:52</div>
  
  <div class="trend-section">
    <h2 class="trend-title">트렌드 분석</h2>
    <div class="trend-grid">
      <div class="trend-card">
        <div class="trend-card-title">방송사 · OTT 비율</div>
        <div class="ratio-bar">
          <div class="ratio-fill b" style="width:0%"></div>
          <div class="ratio-fill o" style="width:100%"></div>
        </div>
        <div class="ratio-legend">
          <span><span class="dot b"></span>방송사 0편 (0%)</span>
          <span><span class="dot o"></span>OTT 0편 (100%)</span>
        </div>
      </div>
      <div class="trend-card">
        <div class="trend-card-title">방송사/OTT별 작품 수</div>
        <div class="stat-list"></div>
      </div>
      <div class="trend-card">
        <div class="trend-card-title">장르 분포</div>
        <div class="stat-list"><div class="ep-empty">장르 데이터가 아직 수집되지 않았습니다.</div></div>
      </div>
      <div class="trend-card">
        <div class="trend-card-title">평점 TOP 5</div>
        <div class="stat-list"><div class="ep-empty">평점 데이터가 아직 충분하지 않습니다.</div></div>
      </div>
    </div>
  </div>
  <div class="filters">
    <button class="pill active" data-f="all">전체</button>
    <button class="pill" data-f="b">방송사</button>
    <button class="pill" data-f="o">OTT</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
document.querySelectorAll('.pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
